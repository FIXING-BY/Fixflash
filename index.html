<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern İndir Butonu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .modern-download {
            position: relative;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 600;
            color: #fff autentic;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .modern-download:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.5);
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
        }

        .modern-download:active {
            transform: translateY(-1px);
        }

        /* İkon */
        .modern-download::before {
            content: "↓";
            font-size: 22px;
            font-weight: bold;
        }

        /* Hafif parlama efekti */
        .modern-download::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255,255,255,0.15) 50%,
                transparent 70%
            );
            transform: translateX(-100%) translateY(-100%) rotate(45deg);
            transition: all 0.6s;
        }

        .modern-download:hover::after {
            transform: translateX(100%) translateY(100%) rotate(45deg);
        }
    </style>
</head>
<body>

    <!-- Google Drive ID'ni buraya yaz -->
    <a href="https://drive.google.com/uc?export=download&id=1lACymoymCC0FbIG8N7QkUbIa9CTGpz1I" 
       class="modern-download" download>
       İNDİR
    </a>

</body>
</html>
