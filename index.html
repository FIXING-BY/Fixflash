<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixing Viewer V2 - PPTX Açıcı</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pptxjs/1.21.1/css/pptxjs.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/c3/0.7.18/c3.min.css">
    
    <style>
        /* SOFT BLACK TEMA */
        body {
            background-color: #181818;
            color: #e0e0e0;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            margin-top: 20px;
        }

        /* SÜRÜKLE BIRAK ALANI */
        #drop-area {
            border: 2px dashed #444;
            border-radius: 10px;
            width: 80%;
            max-width: 600px;
            padding: 40px;
            text-align: center;
            background-color: #222;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }

        #drop-area:hover {
            background-color: #333;
            border-color: #777;
        }

        #drop-area.highlight {
            border-color: #BB86FC;
            background-color: #2a2a2a;
        }

        /* GÖRÜNTÜLEYİCİ */
        #slide-viewer {
            width: 90%;
            height: 600px; /* Sabit yükseklik verelim */
            background: #fff; /* Slaytlar için beyaz zemin şart */
            color: #000;
            border-radius: 5px;
            overflow: auto;
            display: none; /* Başlangıçta gizli */
            position: relative;
        }

        /* Kontrol Butonları */
        .controls {
            display: none;
            margin-bottom: 10px;
            width: 90%;
            text-align: right;
        }

        button {
            background: #BB86FC;
            border: none;
            padding: 8px 15px;
            color: #000;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        #error-msg {
            color: #ff6b6b;
            margin-top: 10px;
            display: none;
            background: rgba(255,0,0,0.1);
            padding: 10px;
            border-radius: 5px;
        }
        
        /* Gizli Input */
        #upload-input {
            display: none;
        }

        .loading {
            display: none;
            color: #BB86FC;
            margin: 20px;
        }
    </style>
</head>
<body>

    <h1>Fixing Viewer <span style="font-size:0.6em; color:#777;">V2</span></h1>

    <div id="drop-area">
        <p style="font-size: 24px;">📂</p>
        <p>PPTX Dosyasını Buraya Sürükle veya Tıkla</p>
        <span style="font-size: 12px; color: #888;">(Dosya yerel olarak işlenir, sunucuya yüklenmez)</span>
    </div>

    <div id="error-msg"></div>

    <div class="loading">Slaytlar ayrıştırılıyor, lütfen bekleyin...</div>

    <div class="controls">
        <button onclick="location.reload()">Yeni Dosya</button>
        <button id="fullscreen-btn">Tam Ekran</button>
    </div>

    <div id="slide-viewer"></div>

    <input type="file" id="upload-input" accept=".pptx">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pptxjs/1.21.1/js/pptxjs.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/5.16.0/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/c3/0.7.18/c3.min.js"></script>

    <script>
        $(document).ready(function() {
            
            const dropArea = document.getElementById('drop-area');
            const fileInput = document.getElementById('upload-input');
            const errorMsg = document.getElementById('error-msg');
            
            // --- 1. Tıklama ile Seçim ---
            dropArea.addEventListener('click', () => {
                fileInput.click();
            });

            // --- 2. Sürükle Bırak Efektleri ---
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, () => dropArea.classList.add('highlight'), false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, () => dropArea.classList.remove('highlight'), false);
            });

            // --- 3. Dosya Bırakıldığında ---
            dropArea.addEventListener('drop', handleDrop, false);

            function handleDrop(e) {
                let dt = e.dataTransfer;
                let files = dt.files;
                if(files.length > 0) {
                    // Güvenlik kısıtlamaları nedeniyle input'un files değerini doğrudan atayamayız
                    // Ancak DataTransfer ile modern tarayıcılarda bu mümkün
                    fileInput.files = files; 
                    // Change eventini manuel tetikle
                    $(fileInput).trigger('change');
                }
            }

            // --- 4. Input Değişince (Asıl İşlem) ---
            $('#upload-input').on('change', function(e) {
                const file = this.files[0];
                
                if (!file) return;
                if (!file.name.endsWith('.pptx')) {
                    showError("Lütfen sadece .pptx uzantılı dosya seçin.");
                    return;
                }

                // UI Temizle
                $('#drop-area').hide();
                $('.loading').show();
                $('#error-msg').hide();

                try {
                    // PPTXjs Kütüphanesini Başlat
                    // fileInputId parametresi, kütüphanenin dosyayı kendisinin okumasını sağlar
                    $("#slide-viewer").pptxToHtml({
                        fileInputId: "upload-input",
                        slideMode: false,
                        keyBoardShortCut: true,
                        mediaProcess: true, 
                        jsZipV2: false,
                        slideModeConfig: {  
                            first: 1, 
                            nav: true, 
                            navTxtColor: "black", 
                            showSlideNum: true, 
                            showTotalSlideNum: true, 
                            autoSlide: false, 
                            randomAutoSlide: false, 
                            loop: false, 
                            background: "white", 
                            transition: "default", 
                            transitionTime: 1
                        }
                    });

                    // İşlem bitince UI güncelle (Kütüphanenin callback'i olmadığı için timeout ile hile yapıyoruz)
                    setTimeout(() => {
                        $('.loading').hide();
                        $('#slide-viewer').fadeIn();
                        $('.controls').fadeIn();
                        
                        // İçerik kontrolü
                        if($('#slide-viewer').html().trim() === "") {
                             // Eğer boşsa muhtemelen hata olmuştur
                             showError("Slayt ayrıştırılamadı. Dosya bozuk olabilir veya tarayıcı güvenlik kısıtlaması (CORS) engelliyor olabilir.");
                             $('#drop-area').show();
                        }
                    }, 1500);

                } catch (err) {
                    console.error(err);
                    showError("Bir hata oluştu: " + err.message);
                    $('.loading').hide();
                    $('#drop-area').show();
                }
            });

            // Tam ekran butonu
            $('#fullscreen-btn').click(function() {
                const elem = document.getElementById("slide-viewer");
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) { /* Safari */
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) { /* IE11 */
                    elem.msRequestFullscreen();
                }
            });

            function showError(msg) {
                $('#error-msg').text(msg).show();
            }
        });
    </script>
</body>
</html>
