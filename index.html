<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Fixing Viewer - v2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/meshesha/PPTXjs@master/css/pptxjs.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/nvd3/1.8.6/nv.d3.min.css">

    <style>
        :root { --bg: #121212; --card: #1e1e1e; --accent: #BB86FC; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; text-align: center; }
        header { padding: 20px; background: var(--card); border-bottom: 2px solid var(--accent); }
        #drop-zone { 
            margin: 50px auto; width: 80%; max-width: 500px; height: 200px; 
            border: 2px dashed #444; border-radius: 20px; display: flex; 
            align-items: center; justify-content: center; cursor: pointer;
        }
        #result { background: white; margin: 20px; border-radius: 10px; min-height: 500px; display: none; }
        #loading { display: none; color: var(--accent); margin-top: 20px; }
        .brand { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

<header><span class="brand">FIXING</span> VIEWER PRO</header>

<div id="drop-zone" onclick="document.getElementById('pptx-input').click()">
    <div>PPTX Dosyasını Buraya Bırak veya Seç</div>
</div>

<input type="file" id="pptx-input" accept=".pptx" style="display:none;">
<div id="loading">Fixing Motoru Hazırlanıyor...</div>
<div id="result"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip-utils/0.1.0/jszip-utils.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/nvd3/1.8.6/nv.d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/meshesha/PPTXjs@master/js/pptxjs.js"></script>
<script src="https://cdn.jsdelivr.net/gh/meshesha/PPTXjs@master/js/divs2slides.js"></script>

<script>
    $(document).ready(function() {
        const $input = $("#pptx-input");
        const $result = $("#result");
        const $loading = $("#loading");

        $input.on("change", function(e) {
            const file = e.target.files[0];
            if(!file) return;

            $("#drop-zone").hide();
            $loading.show();

            // PPTXjs doğrudan file objesiyle bazen sorun yaşayabiliyor
            // Bu yüzden "fileInputId" üzerinden gitmek en garantisi
            $result.pptxToHtml({
                fileInputId: "pptx-input",
                slideMode: false,
                keyBoardShortCut: true,
                success: function() {
                    $loading.hide();
                    $result.show();
                },
                error: function(err) {
                    $loading.hide();
                    alert("Yükleme başarısız. Konsol hatasına bak.");
                    console.log("Hata detayı:", err);
                }
            });
        });
    });
</script>
</body>
</html>
