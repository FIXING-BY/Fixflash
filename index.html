<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixing Viewer | Web Edition</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pptxjs/1.21.1/css/pptxjs.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/nvd3/1.8.6/nv.d3.min.css">

    <style>
        /* FIXING SOFT BLACK TEMA */
        body {
            margin: 0;
            padding: 0;
            background-color: #121212; /* Soft Siyah */
            color: #E0E0E0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Üst Header */
        header {
            background-color: #1E1E1E;
            padding: 15px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 300;
        }
        .logo span {
            color: #BB86FC; /* Fixing Moru */
            font-weight: bold;
        }

        /* Ana İçerik Alanı */
        #main-area {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212;
        }

        /* Sürükle Bırak Kutusu */
        #drop-zone {
            width: 60%;
            height: 40%;
            border: 3px dashed #333;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #1E1E1E;
            transition: 0.3s;
            cursor: pointer;
        }

        #drop-zone:hover {
            border-color: #BB86FC;
            background-color: #252525;
        }

        #drop-zone i {
            font-size: 60px;
            color: #BB86FC;
            margin-bottom: 20px;
            font-style: normal;
        }

        #drop-zone p {
            font-size: 18px;
            color: #888;
        }

        /* Viewer (Slayt Gösterici) */
        #viewer-wrapper {
            width: 100%;
            height: 100%;
            display: none; /* Başlangıçta gizli */
            background-color: #fff; /* Slaytlar için beyaz zemin şart */
            overflow: auto;
        }

        /* Uyarı Kutusu */
        #warning {
            position: absolute;
            bottom: 20px;
            background: #CF6679;
            color: #000;
            padding: 10px 20px;
            border-radius: 5px;
            display: none;
            font-weight: bold;
        }

        /* Loader */
        .loader {
            display: none;
            border: 5px solid #333;
            border-top: 5px solid #BB86FC;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Dosya Input Gizli */
        #file-upload { display: none; }

        /* Kapat Butonu */
        #close-btn {
            display: none;
            background: #BB86FC;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>Fixing</span> Viewer</div>
        <button id="close-btn" onclick="location.reload()">Kapat</button>
    </header>

    <div id="main-area">
        <div id="drop-zone">
            <i>📂</i>
            <p>Dosyayı Buraya Sürükle (Web DD)</p>
            <span style="font-size:12px; color:#555;">Sadece .pptx</span>
        </div>

        <div class="loader" id="loader"></div>

        <div id="viewer-wrapper">
            <div id="pptx-result"></div>
        </div>

        <div id="warning"></div>
    </div>

    <input type="file" id="file-upload" accept=".pptx">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nvd3/1.8.6/nv.d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pptxjs/1.21.1/js/pptxjs.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pptxjs/1.21.1/js/divs2slides.js"></script>

    <script>
        $(document).ready(function() {
            // PROTOKOL KONTROLÜ
            if (window.location.protocol === 'file:') {
                $('#warning').show().html("UYARI: Bu dosyayı masaüstünden açtığınız için çalışmayabilir.<br>Lütfen bir sunucuya (Hosting/Localhost) yükleyin.");
            }

            const dropZone = $('#drop-zone');
            const fileInput = $('#file-upload');
            const loader = $('#loader');
            const viewerWrapper = $('#viewer-wrapper');
            const closeBtn = $('#close-btn');

            // 1. Tıklama
            dropZone.click(() => fileInput.click());

            // 2. Drag & Drop Efektleri
            dropZone.on('dragover', function(e) {
                e.preventDefault();
                e.stopPropagation();
                $(this).css({'border-color': '#BB86FC', 'background': '#252525'});
            });

            dropZone.on('dragleave', function(e) {
                e.preventDefault();
                e.stopPropagation();
                $(this).css({'border-color': '#333', 'background': '#1E1E1E'});
            });

            // 3. Dosya Bırakma
            dropZone.on('drop', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                const files = e.originalEvent.dataTransfer.files;
                if (files.length > 0) {
                    processFile(files[0]);
                }
            });

            // 4. Input Değişimi
            fileInput.change(function() {
                if (this.files.length > 0) {
                    processFile(this.files[0]);
                }
            });

            function processFile(file) {
                if (!file.name.toLowerCase().endsWith('.pptx')) {
                    alert("Lütfen geçerli bir .pptx dosyası yükleyin.");
                    return;
                }

                // UI Değişimi
                dropZone.hide();
                loader.show();
                $('#warning').hide();

                // Dosyayı Oku
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        // Blob URL Oluştur (Web Standartı)
                        const blob = new Blob([e.target.result], { type: file.type });
                        const url = URL.createObjectURL(blob);

                        // PPTXJS Başlat
                        $("#pptx-result").pptxToHtml({
                            pptxFileUrl: url,
                            slideMode: false,
                            keyBoardShortCut: true,
                            mediaProcess: true,
                            slideModeConfig: {
                                first: 1, 
                                nav: true, 
                                navTxtColor: "black", 
                                showSlideNum: false, 
                                showTotalSlideNum: false, 
                                autoSlide: false, 
                                randomAutoSlide: false, 
                                loop: false, 
                                background: "white", 
                                transition: "default", 
                                transitionTime: 1
                            }
                        });

                        // Yükleme Tamamlanınca
                        setTimeout(() => {
                            loader.hide();
                            viewerWrapper.fadeIn();
                            closeBtn.show();
                        }, 2000);

                    } catch (error) {
                        loader.hide();
                        dropZone.show();
                        alert("Hata: Web sunucusunda çalıştığınızdan emin olun.\n" + error);
                    }
                };
                reader.readAsArrayBuffer(file);
            }
        });
    </script>
</body>
</html>
